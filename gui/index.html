<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>herdr</title>
  </head>
  <body>
    <div id="banner" class="connection-banner" hidden></div>
    <div id="app">
      <aside id="sidebar"></aside>
      <div id="sidebar-resize-handle"></div>
      <main id="workspace">
        <div id="tab-strip"></div>
        <div id="toolbar"></div>
        <div id="terminal-wrap">
          <canvas id="terminal" tabindex="0"></canvas>
          <textarea
            id="keyboard-capture"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            aria-hidden="true"
          ></textarea>
        </div>
      </main>
    </div>
    <footer id="usage-bar"></footer>
    <div id="error-notices"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
