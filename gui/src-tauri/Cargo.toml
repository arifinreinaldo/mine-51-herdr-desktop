[package]
name = "herdr-gui"
version = "0.1.0"
description = "herdr GUI: a Tauri 2 client for the herdr terminal multiplexer server"
edition = "2021"
build = "build.rs"
publish = false

[lib]
# The `_lib` suffix keeps the lib crate name distinct from the `herdr-gui`
# bin target; without it, Cargo's default name mangling collides on Windows
# (see the `npm create tauri-app` scaffold comment for this exact issue).
name = "herdr_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
herdr-wire = { path = "../crates/herdr-wire" }
serde = { version = "1", features = ["derive"] }
# `preserve_order` (Phase 1.6 §7): the statusLine editor (`statusline.rs`)
# reads and rewrites `~/.claude/settings.json` while keeping every other
# key's order unchanged (spec §4.3 step 5).
serde_json = { version = "1", features = ["preserve_order"] }
bincode = { version = "2", features = ["serde"] }
interprocess = { version = "2.4.2", features = ["tokio"] }
# `process` (Phase 1.6 §3): `engine.rs` spawns `herdr --version`/`herdr
# server`/`herdr server stop`/`powershell.exe -File install.ps1` and streams
# their stdout/stderr.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# Folder picker (Workspace > New Workspace...) and the VS Code theme file
# picker (View > Import VS Code Theme...), both called from Rust only (spec
# §1, §2.3): the webview gets no `dialog:*` permission.
tauri-plugin-dialog = "2"
# Desktop toasts for the agent-done notification (spec §7 "Agent done
# notification"), called from Rust only.
tauri-plugin-notification = "2"
# Settings... opens config.toml with `open_path`; a missing config.toml
# instead reveals its directory with `reveal_item_in_dir` (spec §4).
tauri-plugin-opener = "2"
# Stops WebView2 from swallowing F5/F3/Ctrl+F/Ctrl+P/Ctrl+R/Ctrl+Shift+I so
# they reach the terminal instead of reloading/printing/opening devtools
# (spec §1 "WebView2 browser keys are disabled").
tauri-plugin-prevent-default = { version = "4", features = ["platform-windows"] }
# `.vsix` theme import (spec §2.3): a `.vsix` is a zip archive.
zip = "2"
# JSONC-tolerant parser for VS Code theme files (comments + trailing commas,
# spec §2.3 "Theme JSON is JSONC").
json5 = "0.4"
# `herdr menu > Start at Login` (Phase 1.6 §3.3): HKCU Run, launches the GUI
# (never a Windows service).
tauri-plugin-autostart = "2"
# Second launch focuses/unminimizes the existing window instead of failing
# to create its webview (0x800700AA, the profile is in use) -- Phase 1.6
# addendum §11 item 4. Registered first in `lib.rs`'s builder, before every
# other plugin.
tauri-plugin-single-instance = "2"
# The embedded engine payload's SHA-256 re-verify at install time (Phase 1.6
# addendum §11.1): already resolved in the tree at this exact version via
# `zip`'s own dependency chain (see Cargo.lock), so this adds no second copy.
sha2 = "0.10"
# WebView2 memory target (Phase 1.6 §6.1): dropped to LOW while the window
# is minimized/hidden, back to NORMAL on restore. Windows only -- `wry`
# already depends on this exact version, so this adds no second copy.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# `Interface::cast` (COM interface upcasting to `ICoreWebView2_19`) and
# `windows::core::Result`, spec §7: "Use windows/windows-sys only if they
# are already in the tree" -- `windows` 0.61 is already resolved (via
# `webview2-com`/`wry`), so this adds no second copy either.
windows = { version = "0.61", features = [] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "test-util"] }
