[package]
name = "herdr-wire"
version = "0.1.0"
edition = "2021"
description = "herdr client-owned-shell wire protocol types and framing, copied from herdr's src/protocol/wire.rs"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = { version = "2", features = ["serde"] }
serde_json = "1"

[dev-dependencies]
sha2 = "0.10"
